name: Тесты на Windows, Mac и Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Библиотеки
        run: python -m pip install --disable-pip-version-check pytest "mcp>=2.3,<3" keyring msal msal-extensions certifi
      - name: Тесты (консоль Windows — без UTF-8, как у учеников)
        run: python -m pytest -v tests
